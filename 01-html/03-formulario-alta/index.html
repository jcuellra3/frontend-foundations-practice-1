<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alta de usuario</title>
  </head>

  <body>
    <main>
      <h1>Crear cuenta</h1>
      <form action="/alta" method="post">
        <fieldset>
          <legend>Datos personales</legend>

          <div>
            <label for="nombre">Nombre completo</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              required
              minlength="3"
              maxlength="80"
            />
          </div>

          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div>
            <label for="contrasena">Contraseña</label>
            <input
              type="password"
              id="contrasena"
              name="contrasena"
              required
              minlength="8"
              maxlength="64"
              aria-describedby="ayuda-contrasena"
            />
            <small id="ayuda-contrasena"> Mínimo 8 caracteres. </small>
          </div>

          <div>
            <label for="fecha-nacimiento">Fecha de nacimiento</label>
            <input
              type="datetime-local"
              id="fecha-nacimiento"
              name="fechaNacimiento"
              required
              min="1900-01-01"
            />
          </div>

          <div>
            <label for="pais">País</label>
            <select id="pais" name="pais" multiple required>
              <option value="">Selecciona un país</option>
              <option value="es">España</option>
              <option value="ru">Rusia</option>
              <option value="otro">Otro</option>
            </select>
          </div>
        </fieldset>

        <fieldset>
          <legend>Preferencia de contacto</legend>

          <input
            type="radio"
            id="contacto-email"
            name="contacto"
            value="email"
            required
          />
          <label for="contacto-email">Email</label>

          <input
            type="radio"
            id="contacto-telefono"
            name="contacto"
            value="telefono"
          />
          <label for="contacto-telefono">Teléfono</label>
        </fieldset>

        <input type="checkbox" id="terminos" name="terminos" required />
        <label for="terminos">Acepto los términos y condiciones</label>

        <div>
          <label for="comentarios">Comentarios opcionales</label>
          <textarea
            id="comentarios"
            name="comentarios"
            maxlength="500"
          ></textarea>
        </div>

        <button type="submit">Registrarse</button>
      </form>
    </main>
  </body>
</html>
