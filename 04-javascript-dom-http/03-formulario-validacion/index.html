<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro</title></head><body><main><h1>Registro</h1><form id="form" novalidate><div><label for="name">Nombre</label><input id="name" name="name" required minlength="2"><p id="name-error"></p></div><div><label for="email">Email</label><input id="email" name="email" type="email" required><p id="email-error"></p></div><div><label for="password">Contraseña</label><input id="password" name="password" type="password" required minlength="8"><p id="password-error"></p></div><label><input id="terms" name="terms" type="checkbox" required> Acepto las condiciones</label><p id="terms-error"></p><button>Crear cuenta</button><p id="status" role="status"></p></form></main><script type="module" src="app.js"></script></body></html>
